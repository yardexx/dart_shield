# Complete configuration for dart_shield
shield:
  rules:
    - prefer_https_over_http
    - avoid_hardcoded_secrets
  experimental_rules:
    - avoid_hardcoded_urls
    - avoid_weak_hashing
    - prefer_secure_random
  enable_experimental: true
  exclude:
    - 'test/**'
    - '**/*.g.dart'
    - 'lib/generated/**'
