name: dart_shield
description: Open-source static analysis tool that helps secure your Dart codebase by detecting vulnerabilities before they reach production.
version: 0.1.0-dev.6
repository: https://github.com/yardexx/dart_shield
issue_tracker: https://github.com/yardexx/dart_shield/issues
topics:
  - security
  - analyzer
  - sast
  - tools
  - static-analysis

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  analyzer: ^8.2.0
  analyzer_plugin: ^0.13.8
  args: ^2.5.0
  cli_completion: ^0.5.1
  collection: ^1.18.0
  file: ^7.0.0
  file_system: ^2.0.0
  glob: ^2.1.2
  json_annotation: ^4.9.0
  mason_logger: ^0.3.3
  path: ^1.9.0
  pub_updater: ^0.5.0
  source_span: ^1.10.0
  yaml: ^3.1.2

dev_dependencies:
  build_runner: ^2.4.10
  json_serializable: ^6.8.0
  test: ^1.25.5
  very_good_analysis: ^10.0.0

executables:
  dart_shield:
